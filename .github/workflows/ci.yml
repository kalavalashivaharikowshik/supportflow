name: SupportFlow CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  backend-tests:
    name: Backend Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: sqlite:///./test_supportflow.db
      ENVIRONMENT: test
      TESTING: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          ruff check app

      - name: Run pytest
        run: |
          pytest -v


  frontend-checks:
    name: Frontend Lint and Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint

      - name: Build frontend
        run: |
          npm run build


  e2e-tests:
    name: Playwright E2E

    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-checks

    env:
      DATABASE_URL: sqlite:///./supportflow_e2e.db
      ENVIRONMENT: test
      TESTING: "true"
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      FRONTEND_URL: http://127.0.0.1:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare E2E database
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m app.db.seed_e2e

      - name: Start backend
        working-directory: backend
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > frontend.log 2>&1 &

      - name: Wait for backend
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8000/api/health"

          for _ in range(60):
              try:
                  urllib.request.urlopen(url)
                  print("Backend ready")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Backend did not start")
          PY

      - name: Wait for frontend
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:5173"

          for _ in range(60):
              try:
                  urllib.request.urlopen(url)
                  print("Frontend ready")
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("Frontend did not start")
          PY

      - name: Run Playwright tests
        working-directory: frontend
        run: |
          npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7